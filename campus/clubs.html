<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clubs · AIP-Campus</title>
<link rel="stylesheet" href="css/style.css">
<style>
.club-list{margin-top:24px}
.club-row{display:flex;align-items:center;gap:24px;padding:28px 32px;background:var(--card);border:1px solid var(--line);margin-bottom:16px;cursor:pointer;transition:border-color 0.35s ease,transform 0.35s ease,box-shadow 0.35s ease}
.club-row:hover{border-color:var(--moss);transform:translateX(6px);box-shadow:0 8px 32px rgba(15,61,46,0.08)}
.club-row .cr-icon{width:64px;height:64px;border-radius:50%;background:var(--forest-deep);color:#fff;display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;font-size:24px;font-weight:700;flex-shrink:0}
.club-row .cr-body{flex:1;min-width:0}
.club-row .cr-name{font-family:Georgia,serif;font-size:20px;font-weight:700;font-style:italic}
.club-row .cr-cn{font-size:12px;color:var(--moss);margin-top:2px;letter-spacing:0.1em}
.club-row .cr-desc{font-size:13px;color:var(--text-mute);margin-top:6px;line-height:1.6;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.club-row .cr-meta{display:flex;gap:16px;align-items:center;flex-shrink:0;font-size:12px;color:var(--text-mute)}
.club-row .cr-meta .cr-tag{padding:4px 10px;border:1px solid var(--line);font-size:11px;letter-spacing:0.05em}
.club-row .cr-arrow{color:var(--moss);font-size:20px;flex-shrink:0;transition:transform 0.35s ease}
.club-row:hover .cr-arrow{transform:translateX(6px)}
@media(max-width:768px){.club-row{flex-wrap:wrap;padding:20px}.club-row .cr-meta{width:100%;margin-top:8px}}
</style>
</head>
<body>
<div class="bg-decor">
  <div class="giant-text top-right">CLUBS</div>
  <div class="green-block gb1"></div>
</div>
<div class="content-layer">
<nav class="navbar" id="mainNav">
  <a href="../index.html" class="navbar-brand" id="brandArea">
    <svg class="logo-svg" viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="20" y="26" text-anchor="middle" font-family="Georgia,serif" font-size="18" font-weight="700" fill="currentColor">A</text></svg>
    <div><div class="name">AIP-Campus</div><div class="sub">CAMPUS · COMMUNITY · CONVERSATION</div></div>
  </a>
  <div class="navbar-links">
    <a href="index.html" data-page="home">Home</a>
    <a href="about.html" data-page="about">About</a>
    <a href="clubs.html" data-page="clubs" class="active">Clubs</a>
    <a href="news.html" data-page="news">News</a>
    <a href="forum.html" data-page="forum">Forum</a>
  </div>
  <div class="navbar-right"></div>
</nav>

<div class="container-wide" style="padding-top:60px">
  <h1 style="font-family:Georgia,serif;font-size:42px;font-style:italic;margin-bottom:8px">Clubs</h1>
  <p style="color:var(--text-mute);margin-bottom:24px">Follow to see updates. Join to become a member and post.</p>
  <div style="display:flex;gap:12px;align-items:center;max-width:720px;margin-bottom:36px">
    <div style="position:relative;flex:1">
      <input type="text" id="clubSearch" placeholder="Search clubs..." style="width:100%;padding:14px 44px 14px 20px;border:1px solid var(--line);background:var(--card);font-size:14px;outline:none;transition:border-color 0.3s;box-sizing:border-box">
      <div style="position:absolute;right:16px;top:50%;transform:translateY(-50%);color:var(--text-mute);pointer-events:none">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
      </div>
    </div>
    <button class="btn btn-primary" onclick="DB.getCurrentUser()?location.href='create-club.html':location.href='login.html'" style="white-space:nowrap">+ New Club</button>
  </div>
  <div class="club-list" id="clubList"></div>
</div>

<footer class="site-footer">&copy; 2026 AIP-Campus &middot; <a href="../index.html" style="text-decoration:underline">AIP-Web Home</a></footer>
</div>

<script src="js/data.js"></script><script src="js/app.js"></script>
<script>
App.initNav('clubs');
var allClubs=DB.getClubs();
function renderList(filter){
  filter=(filter||'').toLowerCase();
  var list=allClubs.filter(function(c){
    return !filter||c.name.toLowerCase().indexOf(filter)>=0||(c.nameCn&&c.nameCn.indexOf(filter)>=0)||c.description.toLowerCase().indexOf(filter)>=0;
  });
  var html='';
  for(var i=0;i<list.length;i++){
    var c=list[i];
    var followers=(c.followers||[]).length;
    var members=(c.members||[]).length;
    var jt=c.joinType==='open'?'Open':c.joinType==='apply'?'Apply':'Invite';
    var cn=c.nameCn?'<div class="cr-cn">'+App.esc(c.nameCn)+'</div>':'';
    var cert=c.certified?'<span class="cert-badge" title="AIP Certified">A</span>':'';
    html+='<div class="club-row'+(c.certified?' certified':'')+'" onclick="location.href=\'club-detail.html?id='+c.id+'\'">'+
      '<div class="cr-icon">'+c.icon+'</div>'+
      '<div class="cr-body"><div class="cr-name">'+App.esc(c.name)+cert+'</div>'+cn+
      '<div class="cr-desc">'+App.esc(c.description)+'</div></div>'+
      '<div class="cr-meta"><span>'+members+' members</span><span>'+followers+' followers</span><span class="cr-tag">'+jt+'</span></div>'+
      '<div class="cr-arrow">&rarr;</div></div>';
  }
  if(!html)html='<p style="color:var(--text-mute);text-align:center;padding:40px">No clubs found.</p>';
  document.getElementById('clubList').innerHTML=html;
}
renderList('');
document.getElementById('clubSearch').addEventListener('input',function(e){renderList(e.target.value)});
</script>
</body></html>
