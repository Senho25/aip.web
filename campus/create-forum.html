<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Forum · AIP-Campus</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="content-layer">
<nav class="navbar">
  <a href="../index.html" class="navbar-brand" id="brandArea">
    <svg class="logo-svg" viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="20" y="26" text-anchor="middle" font-family="Georgia,serif" font-size="18" font-weight="700" fill="currentColor">A</text></svg>
    <div><div class="name">AIP-Campus</div><div class="sub">SHEN WAI · INTERNATIONAL ACADEMY</div></div>
  </a>
  <div class="navbar-links">
    <a href="forum.html" data-page="forum" class="active">Forum</a>
  </div>
  <div class="navbar-right"></div>
</nav>

<div class="container-narrow">
  <div class="page-header"><div class="header-en">Create</div><h1>New Forum</h1><p>Start a new discussion space.</p></div>
  <div class="form-card">
    <div class="form-group"><label class="form-label">Forum Name <span class="required">*</span></label><input id="fName" placeholder="e.g. Poetry Corner"></div>
    <div class="form-group"><label class="form-label">Description <span class="required">*</span></label><textarea id="fDesc" rows="3" placeholder="What is this forum about?"></textarea></div>
    <div class="form-group"><label class="form-label">Tags (comma separated)</label><input id="fTags" placeholder="Academic, Campus, Casual, Tech..."></div>
    <div class="form-group">
      <label class="form-label">Anonymous Posting</label>
      <label style="display:flex;align-items:center;gap:8px;font-size:13px"><input type="checkbox" id="fAnon"> Allow anonymous posts</label>
    </div>
    <button class="btn btn-primary btn-lg" style="width:100%;justify-content:center" onclick="create()">Create Forum</button>
  </div>
</div>
</div>
<script src="js/data.js"></script><script src="js/app.js"></script>
<script>
App.initNav('forum');
if(!DB.getCurrentUser())location.href='login.html';
function create(){
  const n=document.getElementById('fName').value.trim();
  const d=document.getElementById('fDesc').value.trim();
  const t=document.getElementById('fTags').value.split(',').map(x=>x.trim()).filter(Boolean);
  const a=document.getElementById('fAnon').checked;
  if(!n||!d){DB.toast('Name and description required');return}
  const r=DB.createForum(n,d,t,a);
  if(r.ok){DB.toast('Forum created');setTimeout(()=>location.href='forum.html',800)}
}
</script>
</body></html>
