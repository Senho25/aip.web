<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saved News · AIP-Campus</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="content-layer">
<nav class="navbar">
  <a href="../index.html" class="navbar-brand" id="brandArea">
    <svg class="logo-svg" viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="20" y="26" text-anchor="middle" font-family="Georgia,serif" font-size="18" font-weight="700" fill="currentColor">A</text></svg>
    <div><div class="name">AIP-Campus</div><div class="sub">CAMPUS · COMMUNITY · CONVERSATION</div></div>
  </a>
  <div class="navbar-links">
    <a href="index.html">Home</a><a href="clubs.html">Clubs</a><a href="news.html">News</a><a href="forum.html">Forum</a>
  </div>
  <div class="navbar-right"></div>
</nav>

<div class="container-wide" style="padding-top:60px">
  <h1 style="font-family:Georgia,serif;font-size:36px;font-style:italic;margin-bottom:8px">Saved News</h1>
  <p style="color:var(--text-mute);margin-bottom:24px">All news you have bookmarked.</p>
  <div style="position:relative;max-width:480px;margin-bottom:32px">
    <input type="text" id="search" placeholder="Search saved news..." style="width:100%;padding:12px 40px 12px 16px;border:1px solid var(--line);background:var(--card);font-size:14px;outline:none;box-sizing:border-box">
  </div>
  <div id="list"></div>
</div>

<footer class="site-footer">&copy; 2026 AIP-Campus · <a href="../index.html" style="text-decoration:underline">AIP-Web Home</a></footer>
</div>
<script src="js/data.js?v=20260925c"></script><script src="js/app.js?v=20260925c"></script>
<script>
App.initNav('news');
if(!DB.getCurrentUser())location.href='login.html';
function render(){
  var q=document.getElementById('search').value.toLowerCase();
  var all=DB.getSavedNews();
  var filtered=all.filter(function(n){return !q||n.title.toLowerCase().indexOf(q)>=0||(n.topic||'').toLowerCase().indexOf(q)>=0});
  var html='';
  for(var i=0;i<filtered.length;i++){
    var n=filtered[i];
    html+='<div class="news-card tap" onclick="location.href=\'news-detail.html?id='+n.id+'\'" style="margin-bottom:16px">'+
      '<div class="thumb">'+Icons.bookmark+'</div>'+
      '<div class="body"><div><div class="cat">'+App.esc(n.topic)+'</div><div class="title">'+App.esc(n.title)+'</div></div>'+
      '<div class="meta"><span>'+n.views+' views</span><span>'+(n.likes||0)+' likes</span></div></div></div>';
  }
  if(!html)html='<div class="empty-state"><div class="text">No saved news.</div></div>';
  document.getElementById('list').innerHTML=html;
}
document.getElementById('search').addEventListener('input',render);
DB.init().then(render);
</script>
</body></html>
