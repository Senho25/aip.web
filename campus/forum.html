<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forum · AIP-Campus</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="bg-decor"><div class="giant-text top-right">FORUM</div></div>
<div class="content-layer">
<nav class="navbar">
  <a href="../index.html" class="navbar-brand" id="brandArea">
    <svg class="logo-svg" viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="20" y="26" text-anchor="middle" font-family="Georgia,serif" font-size="18" font-weight="700" fill="currentColor">A</text></svg>
    <div><div class="name">AIP-Campus</div><div class="sub">SHEN WAI · INTERNATIONAL ACADEMY</div></div>
  </a>
  <div class="navbar-links">
    <a href="index.html" data-page="home">Home</a>
    <a href="about.html" data-page="about">About</a>
    <a href="clubs.html" data-page="clubs">Clubs</a>
    <a href="news.html" data-page="news">News</a>
    <a href="forum.html" data-page="forum" class="active">Forum</a>
  </a>
  <div class="navbar-right"></div>
</nav>

<div class="container-wide">
  <div class="page-header" style="display:flex;justify-content:space-between;align-items:flex-end">
    <div>
      <div class="header-en">Discussion</div>
      <h1>Forum</h1>
      <p>Open discussion for the community.</p>
    </div>
    <button class="btn btn-primary" onclick="DB.getCurrentUser()?location.href='create-forum.html':location.href='login.html'">+ New Forum</button>
  </div>

  <div class="search-bar">
    <span class="search-icon"><svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg></span>
    <input type="text" id="searchInput" placeholder="Search forums...">
    <div class="search-results" id="searchResults"></div>
  </div>

  <div class="filter-bar">
    <div class="filter-group"><span class="filter-label">Sort:</span>
      <button class="filter-chip active" data-sort="alpha">A-Z</button>
      <button class="filter-chip" data-sort="heat">Hot</button>
      <button class="filter-chip" data-sort="recent">Recent</button>
    </div>
    <div class="filter-group"><span class="filter-label">Tag:</span>
      <button class="filter-chip active" data-tag="all">All</button>
      <button class="filter-chip" data-tag="Academic">Academic</button>
      <button class="filter-chip" data-tag="Campus">Campus</button>
      <button class="filter-chip" data-tag="Casual">Casual</button>
      <button class="filter-chip" data-tag="Tech">Tech</button>
      <button class="filter-chip" data-tag="Literature">Literature</button>
      <button class="filter-chip" data-tag="Math">Math</button>
      <button class="filter-chip" data-tag="Art">Art</button>
    </div>
  </div>

  <div id="forumList"></div>
</div>

<footer class="site-footer">© 2026 AIP-Campus · <a href="../index.html" style="text-decoration:underline">AIP-Web Home</a></footer>
</div>

<script src="js/data.js"></script><script src="js/app.js"></script>
<script>
App.initNav('forum');
let sort='alpha',tag='all';
function render(){
  let list=DB.getForums();
  if(tag!=='all')list=list.filter(f=>f.tags.includes(tag));
  if(sort==='alpha')list.sort((a,b)=>a.name.localeCompare(b.name));
  else if(sort==='heat')list.sort((a,b)=>(b.heat||0)-(a.heat||0));
  else list.sort((a,b)=>b.createdAt-a.createdAt);
  document.getElementById('forumList').innerHTML=list.map(f=>{
    const last=f.posts[0];
    return `<div class="forum-bar tap" onclick="location.href='forum-detail.html?id=${f.id}'">
      <div class="forum-bar-photo">${f.name.charAt(0)}</div>
      <div class="forum-bar-main">
        <div class="forum-bar-title">${App.esc(f.name)}</div>
        <div class="forum-bar-tags">${f.tags.map(t=>`<span class="forum-tag">${t}</span>`).join('')}</div>
        <div class="forum-bar-desc">${App.esc(f.description)}</div>
      </div>
      <div class="forum-bar-recent">
        ${f.heat} posts<br><span style="opacity:0.6">${last?DB.timeAgo(last.createdAt):'No posts yet'}</span>
      </div>
    </div>`;
  }).join('');
}
DB.init().then(render);
document.querySelectorAll('[data-sort]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-sort]').forEach(x=>x.classList.remove('active'));b.classList.add('active');sort=b.dataset.sort;render()});
document.querySelectorAll('[data-tag]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tag]').forEach(x=>x.classList.remove('active'));b.classList.add('active');tag=b.dataset.tag;render()});
App.setupGlobalSearch(document.getElementById('searchInput'),document.getElementById('searchResults'));
</script>
</body></html>
