<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>News · AIP-Campus</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="bg-decor"><div class="giant-text bottom-left">NEWS</div></div>
<div class="content-layer">
<nav class="navbar">
  <a href="../index.html" class="navbar-brand" id="brandArea">
    <svg class="logo-svg" viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="20" y="26" text-anchor="middle" font-family="Georgia,serif" font-size="18" font-weight="700" fill="currentColor">A</text></svg>
    <div><div class="name">AIP-Campus</div><div class="sub">SHEN WAI · INTERNATIONAL ACADEMY</div></div>
  </a>
  <div class="navbar-links">
    <a href="index.html" data-page="home">Home</a>
    <a href="about.html" data-page="about">About</a>
    <a href="clubs.html" data-page="clubs">Clubs</a>
    <a href="news.html" data-page="news" class="active">News</a>
    <a href="forum.html" data-page="forum">Forum</a>
  </a>
  <div class="navbar-right"></div>
</nav>

<div class="container">
  <div class="page-header" style="display:flex;justify-content:space-between;align-items:flex-end">
    <div>
      <div class="header-en">Announcements & Updates</div>
      <h1>News</h1>
    </div>
    <button class="btn btn-primary" onclick="DB.getCurrentUser()?location.href='publish.html':location.href='login.html'">+ Publish</button>
  </div>

  <div class="search-bar">
    <span class="search-icon"><svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg></span>
    <input type="text" id="searchInput" placeholder="Search news...">
    <div class="search-results" id="searchResults"></div>
  </div>

  <div id="newsList"></div>
</div>

<footer class="site-footer">© 2026 AIP-Campus · <a href="../index.html" style="text-decoration:underline">AIP-Web Home</a></footer>
</div>

<script src="js/data.js"></script><script src="js/app.js"></script>
<script>
App.initNav('news');
function renderNews(list){
  var sorted=list.slice().sort(function(a,b){return (b.pinned?1:0)-(a.pinned?1:0)||b.createdAt-a.createdAt});
  document.getElementById('newsList').innerHTML=sorted.map(n=>`
    <div class="news-card tap" onclick="location.href='news-detail.html?id=${n.id}'">
      <div class="thumb">${(function(){var m=(n.content||'').match(/\[img:([^\]]+)\]/);return m?'<img src="'+m[1]+'" style="width:100%;height:100%;object-fit:cover;opacity:0.85">':App.icon('megaphone')})()}</div>
      <div class="body">
        <div>
          <div class="cat">${App.esc(n.topic||'Announcement')}</div>
          <div class="title">${n.pinned?'<span class="pin-badge">PINNED</span>':''}${App.esc(n.title)}</div>
          <div class="slogan">${App.esc(n.slogan)}</div>
        </div>
        <div class="meta">
          <span><a href="${n.authorType==='club'?'club-detail.html?id='+n.authorId:'user-profile.html?uid='+n.authorId}" style="color:var(--moss)">${App.esc(n.authorName)}</a></span>
          <span>${Icons.eye} ${n.views}</span>
          <span>${Icons.clock} ${DB.timeAgo(n.createdAt)}</span>
        </div>
      </div>
    </div>
  `).join('');
}
renderNews(DB.getNews());
App.setupGlobalSearch(document.getElementById('searchInput'),document.getElementById('searchResults'));
</script>
</body></html>
