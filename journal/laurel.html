<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laurel · AIP-Journal</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Helvetica Neue',Arial,sans-serif;background:#0a0a0a;color:#e8e4dc;min-height:100vh;letter-spacing:0.02em}
a{color:inherit;text-decoration:none}
.Laurel-yellow{color:#d4e8a0}

.wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;text-align:center;position:relative}

/* Minimal frame decorations */
.frame{position:absolute;inset:24px;border:1px solid rgba(212,232,160,0.15);pointer-events:none}
.frame::before{content:'';position:absolute;top:10px;left:10px;right:10px;bottom:10px;border:1px solid rgba(212,232,160,0.08)}

.kicker{font-size:11px;letter-spacing:0.5em;text-transform:uppercase;color:rgba(212,232,160,0.6);margin-bottom:32px}
h1{font-size:clamp(64px,12vw,140px);font-weight:100;letter-spacing:0.15em;line-height:1;color:#fff;margin-bottom:24px}
h1 span{color:#d4e8a0;font-weight:300}
.tagline{font-size:15px;line-height:1.9;max-width:500px;color:rgba(232,228,220,0.6);margin-bottom:48px}
.cn{font-family:'Noto Serif SC',serif;font-size:16px;color:rgba(212,232,160,0.5);letter-spacing:0.2em;margin-top:12px}

.coming{display:inline-block;padding:10px 32px;border:1px solid rgba(212,232,160,0.3);color:#d4e8a0;font-size:11px;letter-spacing:0.3em;text-transform:uppercase}

.back{position:fixed;top:32px;left:40px;font-size:12px;letter-spacing:0.1em;opacity:0.5;z-index:10}
.back:hover{opacity:1}

.footer{position:absolute;bottom:32px;left:0;right:0;text-align:center;font-size:10px;letter-spacing:0.3em;opacity:0.3}
</style>
</head>
<body>
<a href="../index.html" class="back">← JOURNAL</a>
<div class="wrap">
  <div class="frame"></div>
  <div class="kicker">AIP · Photography Journal</div>
  <h1>La<span>u</span>rel</h1>
  <p class="tagline">Frames, light, and the quiet geometry of the world.
  <br>A visual journal — every frame a thought, every exposure a sentence.
  <span class="cn">光与影之间 · 帧与帧之外</span></p>
  <div class="coming">Coming Soon · Vol. I · 敬请期待</div>
</div>
<div class="footer">Laurel · AIP-JOURNAL · 2026</div>
</body>
</html>
